<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jalwa Pro - Professional</title>
    <style>
        :root { 
            --bg: #010A22; --card: #161d31; --gold: #fb9401; 
            --green: #2ecc71; --red: #d9534f; --violet: #9c27b0; 
            --gray: #8a9bb5; 
        }
        body { background: var(--bg); color: white; font-family: sans-serif; margin: 0; padding-bottom: 50px; user-select: none; }
        .app { width: 100%; max-width: 400px; margin: auto; }
        .wallet { background: linear-gradient(135deg, #022170, #022170); margin: 10px; padding: 15px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; }
        .timer-card { background: #196C62; margin: 10px; border-radius: 15px; padding: 15px; display: flex; justify-content: space-between; border: 1px solid #1f4037; }
        /* ٹائمر کے باکسز کا نیا ڈیزائن */
.clock { 
    display: flex; 
    gap: 4px; 
    justify-content: flex-end; 
    align-items: center;
}
.time-unit { 
    background: #000000;
    color: #ffffff; 
    padding: 3px 4px; /* یہاں 8px کو 4px کر دیا گیا ہے چوڑائی کم کرنے کے لیے */
    border-radius: 4px; 
    font-size: 28px; 
    font-weight: bold; 
    min-width: 8px; /* یہاں 24px کو 18px کر دیا گیا ہے */
    text-align: center;
    line-height: 1;
}

.time-sep { 
    color: white; 
    font-size: 24px; 
    font-weight: bold; 
}

.timer-label {
    font-size: 14px; 
    color: rgba(255, 255, 255, 0.8); /* ہلکا سفید رنگ */
    text-align: right; /* ٹائمر کے ساتھ برابر کرنے کے لیے */
    margin-bottom: 5px; /* ٹائمر اور ٹیکسٹ کے درمیان فاصلہ */
    font-weight: 500;
}


        .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; padding: 15px; background: #01164D; margin: 10px; border-radius: 15px; }
        .ball-btn { width: 100%; cursor: pointer; border: none; background: none; }
        .ball-btn img { width: 120%; height: auto; }
        
        .last-res-box { display: flex; gap: 5px; margin-top: 8px; align-items: center; }
        .res-ball-img { width: 28px; height: 28px; border-radius: 50%; }

        .history { margin: 10px; background: var(--card); border-radius: 12px; overflow: hidden; min-height: 250px; }
        .h-tabs { display: flex; background: #10192d; }
        .h-tab { flex:1; text-align:center; padding:12px; cursor:pointer; color: var(--gray); font-size: 14px; font-weight: bold; }
        .h-tab.active { color: white; border-bottom: 2px solid var(--gold); background: rgba(251, 148, 1, 0.1); }
        table { width: 100%; border-collapse: collapse; text-align: center; }
        th { background: #1c2641; padding: 10px; color: var(--gray); font-size: 12px; }
        td { padding: 12px 5px; border-bottom: 1px solid #242d41; font-size: 13px; }

        @keyframes popScale { from { transform: scale(0.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .pop-top { padding: 30px 20px; color: white; position: relative; }
        .pop-win { background: linear-gradient(180deg, #00d2ff 0%, #3a7bd5 100%); }
        .pop-loss { background: linear-gradient(180deg, #4b6cb7 0%, #182848 100%); }
        .win-amt-text { font-size: 36px; font-weight: bold; color: #fb9401; text-shadow: 0 2px 4px rgba(0,0,0,0.2); margin: 15px 0; }
        .pop-details { padding: 20px; color: #333; font-weight: 500; }
        .pop-close-btn { background: #fb9401; color: white; border: none; width: 100%; padding: 15px; font-weight: bold; font-size: 16px; cursor: pointer; }

        /* Dot Style */
        .dot { height: 10px; width: 10px; border-radius: 50%; display: inline-block; margin-right: 3px; }

        /* Sheet Style */
        .sheet { position: fixed; bottom: -100%; left: 0; width: 100%; background: #0b1426; border-radius: 25px 25px 0 0; transition: 0.3s; z-index: 2001; padding-bottom: 20px; }
        .sheet.active { bottom: 0; }
        .sheet-head { padding: 15px; text-align: center; border-radius: 25px 25px 0 0; font-weight: bold; }
        .row-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; border-bottom: 1px solid #1c2641; }
        .chip { background: #1c2641; border: none; color: white; padding: 8px 12px; border-radius: 5px; cursor: pointer; font-size: 13px; }
        .chip.active { background: var(--green); }
        .qty-box { display: flex; align-items: center; background: #060e1e; border-radius: 5px; }
        .q-btn { background: var(--green); border: none; color: white; width: 30px; height: 30px; font-weight: bold; font-size: 18px; }
        .q-input { width: 40px; text-align: center; background: none; border: none; color: white; }
        .my-bet-item { background: #1c2641; margin: 10px; border-radius: 8px; padding: 12px; display: flex; align-items: center; gap: 15px; position: relative; }
        .bet-icon { width: 45px; height: 45px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 18px; color: white; text-transform: uppercase; }
        .bet-info { flex: 1; }
        .bet-res-amt { text-align: right; font-weight: bold; }

        .res-popup { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 9999; display: none; justify-content: center; align-items: center; backdrop-filter: blur(4px); }
        .png-card { width: 90%; max-width: 350px; height: 420px; background: url('Aap.png') no-repeat center center; background-size: contain; position: relative; animation: popIn 0.3s ease-out; }
        .png-card.fail { background-image: url('fail.png'); } 
      @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .pop-labels { position: absolute; top: 185px; left: 0; width: 100%; display: flex; justify-content: center; gap: 8px; }
        .lbl { padding: 3px 12px; border-radius: 5px; font-size: 12px; font-weight: bold; color: white; text-transform: capitalize; }
        .pop-amt-box { position: absolute; top: 265px; width: 100%; text-align: center; color: #d9534f; font-size: 20px; font-weight: bold; }
        .pop-info-box { position: absolute; top: 288px; width: 100%; text-align: center; color: #666; font-size: 12px; line-height: 1.5; }
        /* بڑی گنتی کا ڈیزائن */
#lock-overlay {
    position: absolute;
    top: 215px; 
    left: 0;
    width: 100%;
    /* Height ko 485px se kam karke 350px kar diya hai taake niche ka hissa khula rahe */
    height: 300px; 
    background: rgba(1, 10, 34, 0.6); 
    display: none;
    z-index: 2500;
    /* Blur ko bhi halka rakha hai */
    backdrop-filter: blur(2px); 
    justify-content: center;
    align-items: center;
    border-radius: 15px;
    gap: 15px; 
}


/* تصویر جیسے نیلے باکسز */
.count-box {
    background: #01164d; /* گہرا نیلا رنگ تصویر جیسا */
    width: 120px;
    height: 180px;
    border-radius: 15px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 140px;
    font-weight: bold;
    color: #2ecc71; /* سبز رنگ تصویر جیسا */
    box-shadow: 0 10px 20px rgba(0,0,0,0.5);
}

/* Premium Glassy Loading Overlay */
#loading-screen {
    position: fixed;
    inset: 0;
    /* یيہاں ہم نے تھوڑا شفاف رنگ اور بلر شامل کیا ہے */
    background: rgba(1, 10, 34, 0.85); 
    backdrop-filter: blur(8px); 
    z-index: 9999;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
}

.loader-container {
    text-align: center;
}

.premium-spinner {
    width: 60px;
    height: 60px;
    border: 3px solid transparent;
    border-top-color: var(--gold);
    border-radius: 50%;
    animation: premium-spin 1s cubic-bezier(0.5, 0, 0.5, 1) infinite;
    position: relative;
}

.premium-spinner::before {
    content: '';
    position: absolute;
    inset: -8px;
    border: 3px solid transparent;
    border-top-color: rgba(251, 148, 1, 0.3);
    border-radius: 50%;
    animation: premium-spin 2s linear infinite;
}

.loader-text {
    margin-top: 25px;
    color: white;
    font-size: 16px;
    font-weight: 300;
    letter-spacing: 3px;
    text-transform: uppercase;
    text-shadow: 0 0 10px rgba(251, 148, 1, 0.5);
}

@keyframes premium-spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}


    </style>
</head>
<body>
<div id="loading-screen">
    <div class="loader-container">
        <div class="premium-spinner"></div>
        <div class="loader-text">Initializing Game...</div>
    </div>
</div>

<div id="lock-overlay">
    <div class="count-box">0</div>
    <div class="count-box" id="big-count-text">5</div>
</div>

<div class="app">
    <div class="wallet">
        <div><small>Available Balance</small><div id="bal-text" style="font-size: 22px; font-weight: bold;">₹0.00</div></div>
        <button onclick="loadBalance()" style="background:var(--gold); border:none; padding:8px 20px; border-radius:20px; font-weight:bold;">Refresh</button>
    </div>

        <div class="timer-card">
        <div>
            <div>WinGo 30sec </div>
            <div style="font-size: 14px; color:rgba(255,255,255,0.7)">Last 5 Result</div>
            <div id="last-5-results" class="last-res-box"></div>
        </div>
        <div style="text-align: right;">
            <div class="timer-label">Time remaining</div>
            <div id="clock" class="clock">
                <div class="time-unit" id="m1">0</div>
                <div class="time-unit" id="m2">0</div>
                <div class="time-sep">:</div>
                <div class="time-unit" id="s1">0</div>
                <div class="time-unit" id="s2">0</div>
            </div>
            <div id="period" style="font-weight: bold; font-size: 18px; color: white; margin-top:5px;">Loading...</div>
        </div>
    </div>


    <div style="display:flex; gap:10px; padding:10px;">
        <button onclick="openBet('Green')" style="flex:1; background:var(--green); border:none; padding:15px; border-radius:8px; color:white; font-weight:bold;">Green</button>
        <button onclick="openBet('Violet')" style="flex:1; background:var(--violet); border:none; padding:15px; border-radius:8px; color:white; font-weight:bold;">Violet</button>
        <button onclick="openBet('Red')" style="flex:1; background:var(--red); border:none; padding:15px; border-radius:8px; color:white; font-weight:bold;">Red</button>
    </div>

    <div class="grid" id="num-grid"></div>

    <div style="display:flex; gap:10px; padding:0 10px 10px;">
        <button onclick="openBet('Big')" style="flex:1; background:var(--gold); border:none; padding:12px; border-radius:8px; font-weight:bold;">Big</button>
        <button onclick="openBet('Small')" style="flex:1; background:#3498db; border:none; padding:12px; border-radius:8px; color:white; font-weight:bold;">Small</button>
    </div>

    <div class="history">
        <div class="h-tabs">
            <div class="h-tab active" id="tab-game" onclick="switchTab('game')">Game history</div>
            <div class="h-tab" id="tab-my" onclick="switchTab('my')">My history</div>
        </div>
        <div id="game-table-div"><table><thead><tr><th>Period</th><th>Number</th><th>Size</th><th>Color</th></tr></thead><tbody id="h-body"></tbody></table></div>
        <div id="my-table-div" style="display:none; padding-top: 10px;"></div>
    </div>
</div>

<div id="sheet" class="sheet">
    <div id="sheet-header" class="sheet-head">WinGo 30sec</div>
    <div style="padding:10px; text-align:center; background:#1c2641; font-size:13px;">Select <span id="target-name">...</span></div>
    <div class="row-item"><span>Amount</span><div style="display:flex; gap:5px;"><button class="chip active" onclick="setBase(1)">1</button><button class="chip" onclick="setBase(10)">10</button><button class="chip" onclick="setBase(100)">100</button><button class="chip" onclick="setBase(1000)">1000</button></div></div>
    <div class="row-item"><span>Quantity</span><div class="qty-box"><button class="q-btn" onclick="chQty(-1)">-</button><input type="number" id="qty-input" class="q-input" value="1" readonly><button class="q-btn" onclick="chQty(1)">+</button></div></div>
    <div class="row-item" style="justify-content: flex-end; gap:8px;"><button class="chip" onclick="setX(1)">X1</button><button class="chip" onclick="setX(5)">X5</button><button class="chip" onclick="setX(10)">X10</button></div>
    <div style="display:flex; margin:15px 10px 0; gap:10px;"><button onclick="closeBet()" style="flex:1; padding:15px; border:none; background:#283046; color:white; border-radius:5px;">Cancel</button><button id="confirm-btn" onclick="confirmBet()" style="flex:2; padding:15px; border:none; background:var(--green); color:white; font-weight:bold; border-radius:5px;">Total ₹<span id="total-val">1</span></button></div>
</div>
    <div id="res-popup-box" class="res-popup">
    <div class="png-card">
        <div class="pop-labels">
            <span id="pop-color" class="lbl">Color</span>
            <span id="pop-num" class="lbl">0</span>
            <span id="pop-size" class="lbl">Size</span>
        </div>
        <div class="pop-amt-box">₹<span id="pop-amt">0.00</span></div>
        <div class="pop-info-box">
            Period: WinGo 30 Sec<br>
            <span id="pop-period">0000000000</span>
        </div>
    </div>
</div>


<script>
    // Logic mostly same, with History & Popup styling fixes
    const API_URL = "https://script.google.com/macros/s/AKfycbzq-CozHl9G9E4FN3aoFXa2Zq8uT5kX7WOpvMgwgBYzOe-ZpqSA_HjBb85AHWi7jwg/exec";
    const mobile = localStorage.getItem("mobile");
    let balance = 0, base = 1, qty = 1, currentTarget = '';
    const colorsMap = { 0:['red','violet'], 1:['green'], 2:['red'], 3:['green'], 4:['red'], 5:['green','violet'], 6:['red'], 7:['green'], 8:['red'], 9:['green'] };

    // Fill grid
    const grid = document.getElementById('num-grid');
    for(let i=0; i<10; i++) { grid.innerHTML += `<button class="ball-btn" onclick="openBet(${i})"><img src="boll${i}.png" onerror="this.src='https://via.placeholder.com/60?text=${i}'"></button>`; }
    
    async function fetchHistoryFromSheet() {
    let pID = document.getElementById('period').innerText;
    
    if (pID === "Loading..." || !pID) {
        setTimeout(fetchHistoryFromSheet, 1000);
        return;
    }

    const ADMIN_API_URL = "https://script.google.com/macros/s/AKfycbzLv8AJTVp1xpC5ZkvwrzcJj4JGrXtcJvkWE39eqVmOU5SuNpNrkHHIdQmge7Z9747W/exec";

    try {
        const response = await fetch(ADMIN_API_URL, {
            method: "POST",
            body: JSON.stringify({ type: "getHistory", currentPeriod: pID })
        });
        const data = await response.json();

        if (data && data.history && data.history.length > 0) {
            const tbody = document.getElementById('h-body');
            tbody.innerHTML = data.history.map(x => {
                let primaryColor = x.c[0];
                let dots = x.c.map(clr => `<span class="dot" style="background:var(--${clr})"></span>`).join('');
                return `<tr>
                    <td>${x.p}</td>
                    <td style="color:var(--${primaryColor}); font-weight:bold; font-size: 21px;">${x.n}</td>
                    <td>${x.s}</td>
                    <td>${dots}</td>
                </tr>`;
            }).join('');
            
            document.getElementById('last-5-results').innerHTML = data.history.slice(0, 5).map(x => 
                `<img src="boll${x.n}.png" class="res-ball-img" onerror="this.src='https://via.placeholder.com/25?text=${x.n}'">`
            ).join('');

const loader = document.getElementById('loading-screen');
if(loader) {
    loader.style.opacity = '0';
    loader.style.pointerEvents = 'none'; // تاکہ پیچھے کلک ہو سکے
    setTimeout(() => loader.remove(), 600);
}

        } else {
            setTimeout(fetchHistoryFromSheet, 2000);
        }
    } catch (e) {
        console.error("History fetch error:", e);
        // ایرر کی صورت میں بھی لوڈنگ ہٹا دیں تاکہ یوزر اٹک نہ جائے
        setTimeout(() => document.getElementById('loading-screen')?.remove(), 3000);
    }
}

    async function callScript(payload) { try { const r = await fetch(API_URL, { method: "POST", body: JSON.stringify(payload) }); return await r.json(); } catch (e) { return null; } }
    async function loadBalance() { if(!mobile) return; const d = await callScript({ type: "getUser", mobile: mobile }); if(d && d.balance !== undefined) { balance = parseFloat(d.balance); document.getElementById('bal-text').innerText = "₹" + balance.toFixed(2); } }

    function openBet(v) { currentTarget = v; qty = 1; document.getElementById('qty-input').value = 1; document.getElementById('target-name').innerText = v; const h = document.getElementById('sheet-header'); h.style.background = isNaN(v) ? (v==='Green'?'var(--green)':v==='Red'?'var(--red)':'var(--violet)') : '#1c2641'; upTot(); document.getElementById('sheet').classList.add('active'); }
    function closeBet() { document.getElementById('sheet').classList.remove('active'); }
    function setBase(v) { base = v; document.querySelectorAll('.chip').forEach(c => c.classList.remove('active')); event.target.classList.add('active'); upTot(); }
    function chQty(v) { qty = Math.max(1, qty + v); document.getElementById('qty-input').value = qty; upTot(); }
    function setX(x) { qty = x; document.getElementById('qty-input').value = x; upTot(); }
    function upTot() { document.getElementById('total-val').innerText = (base * qty).toFixed(2); }

    function confirmBet() {
        let total = base * qty; if (balance < total) { alert("Insufficient Balance!"); return; }
        let pID = document.getElementById('period').innerText;
        balance -= total; document.getElementById('bal-text').innerText = "₹" + balance.toFixed(2);
        let myH = JSON.parse(localStorage.getItem('my_h')) || [];
        myH.unshift({ p: pID, t: currentTarget, a: total, status: 'pending', res: 0 });
        localStorage.setItem('my_h', JSON.stringify(myH.slice(0, 30)));
        renderMyHistory(); closeBet();
        callScript({ type: "game", mobile: mobile, change: -total }).then(d => { if(d) loadBalance(); });
    }

    function startTimer() {
    let preLoadedWinNum = null; 

    setInterval(async () => {
        let now = new Date();
        let sec = now.getSeconds();
        let timeLeft = 30 - (sec % 30);
        
        // ٹائمر اور پیریڈ اپڈیٹ
                // ٹائمر کی ہندسوں کو الگ الگ باکسز میں اپڈیٹ کرنا
        let timeStr = timeLeft.toString().padStart(2, '0');
        document.getElementById('m1').innerText = "0"; // منٹ کا پہلا ہندسہ
        document.getElementById('m2').innerText = "0"; // منٹ کا دوسرا ہندسہ
        document.getElementById('s1').innerText = timeStr[0]; // سیکنڈ کا پہلا ہندسہ
        document.getElementById('s2').innerText = timeStr[1]; // سیکنڈ کا دوسرا ہندسہ
        
        let totalSeconds = (now.getHours() * 3600) + (now.getMinutes() * 60) + sec;
        let pID = now.getFullYear().toString() + (now.getMonth() + 1).toString().padStart(2, '0') + 
                  now.getDate().toString().padStart(2, '0') + Math.floor(totalSeconds / 30);
        document.getElementById('period').innerText = pID;

        const lockOverlay = document.getElementById('lock-overlay');
        const countText = document.getElementById('big-count-text');

        // --- تصویر والا لاک پاپ اپ (5 سیکنڈ پہلے) ---
        if (timeLeft <= 5) {
            lockOverlay.style.display = 'flex'; 
            countText.innerText = timeLeft; // صرف دوسرے باکس کا نمبر بدلے گا
            closeBet(); 
        } else {
            lockOverlay.style.display = 'none'; 
        }

        if (timeLeft === 9 && preLoadedWinNum === null) {
            preLoadedWinNum = await fetchOnlyWinNum(pID);
        }

        if (timeLeft === 1) {
            setTimeout(() => {
                processResult(pID, preLoadedWinNum);
                preLoadedWinNum = null; 
            }, 1000);
        }
    }, 1000);
}

// رزلٹ پہلے منگوانے کا چھوٹا فنکشن
async function fetchOnlyWinNum(pID) {
    const ADMIN_API_URL = "https://script.google.com/macros/s/AKfycbzLv8AJTVp1xpC5ZkvwrzcJj4JGrXtcJvkWE39eqVmOU5SuNpNrkHHIdQmge7Z9747W/exec";
    try {
        const r = await fetch(ADMIN_API_URL, {
            method: "POST",
            body: JSON.stringify({ type: "getWinNum", currentPeriod: pID.toString().trim() })
        });
        const d = await r.json();
        return d.winNum;
    } catch (e) { return null; }
}




        async function processResult(pID, preLoadedNum) {
    // 1. سب سے پہلے چیک کریں کہ کیا رزلٹ پہلے سے لوڈ ہو چکا ہے
    let winNum = preLoadedNum;

    // 2. اگر نیٹ سلو ہونے کی وجہ سے پہلے لوڈ نہیں ہوا، تو اب دوبارہ کوشش کریں
    if (winNum === null || winNum === undefined) {
        console.log("Result not pre-loaded, trying last minute fetch...");
        const ADMIN_API_URL = "https://script.google.com/macros/s/AKfycbzLv8AJTVp1xpC5ZkvwrzcJj4JGrXtcJvkWE39eqVmOU5SuNpNrkHHIdQmge7Z9747W/exec";
        try {
            const response = await fetch(ADMIN_API_URL, {
                method: "POST",
                body: JSON.stringify({ type: "getWinNum", currentPeriod: pID.toString().trim() })
            });
            const data = await response.json();
            winNum = (data && data.winNum !== undefined) ? data.winNum : Math.floor(Math.random() * 10);
        } catch (e) {
            winNum = Math.floor(Math.random() * 10); // فائنل بیک اپ (Random)
        }
    }

    console.log("Final Win Number: " + winNum);

    // 3. رزلٹ کے حساب سے کلر اور سائز سیٹ کریں
    let winColors = colorsMap[winNum];
    let winSize = winNum >= 5 ? 'Big' : 'Small';
    
    // ہسٹری اپڈیٹ کریں
    setTimeout(() => { fetchHistoryFromSheet(); }, 1000); 

    // 4. یوزر کی بیٹ چیک کریں
    let myH = JSON.parse(localStorage.getItem('my_h')) || [];
    let anyWin = false, totalWin = 0, betFound = false;

    myH.forEach(bet => {
        if (bet.p == pID && bet.status === 'pending') {
            betFound = true;
            let won = false;
            let contract = bet.a * 0.98;

            // نمبر جیت
            if (String(bet.t) === String(winNum)) { 
                bet.res = contract * 9; 
                won = true; 
            }
            // سائز جیت
            else if (bet.t === winSize) { 
                bet.res = contract * 1.96; 
                won = true; 
            }
            // کلر جیت
            else if (winColors.includes(String(bet.t).toLowerCase())) {
                bet.res = (winColors.length > 1) ? contract * 1.5 : contract * 2;
                won = true;
            }

            if (won) {
                bet.status = 'success'; 
                totalWin += bet.res; 
                anyWin = true;
            } else { 
                bet.status = 'failed'; 
            }
        }
    });

    // 5. اگر بیٹ لگی تھی تو رزلٹ پروسیس کریں
    if (betFound) {
        localStorage.setItem('my_h', JSON.stringify(myH));
        if(anyWin) {
            await callScript({ type: "game", mobile: mobile, change: totalWin });
        }
        // وننگ پاپ اپ دکھائیں
        showPopup(anyWin, totalWin, winNum, winColors[0], pID);
        loadBalance();
        renderMyHistory();
    }
}


    function renderLast5() {
        let h = JSON.parse(localStorage.getItem('game_h')) || [];
        document.getElementById('last-5-results').innerHTML = h.slice(0, 5).map(x => `<img src="boll${x.n}.png" class="res-ball-img" onerror="this.src='https://via.placeholder.com/25?text=${x.n}'">`).join('');
    }

    function renderMyHistory() {
    let h = JSON.parse(localStorage.getItem('my_h')) || [];
    const container = document.getElementById('my-table-div');
    if (h.length === 0) { container.innerHTML = "<div style='padding:40px; text-align:center; color:#8a9bb5;'>No Data Available</div>"; return; }

    container.innerHTML = h.map(x => {
        let statusColor = x.status === 'pending' ? '#fb9401' : (x.status === 'success' ? '#2ecc71' : '#d9534f');
        let statusText = x.status === 'success' ? 'Succeed' : (x.status === 'pending' ? 'Pending' : 'Failed');
        
        // --- Naya Color Logic ---
        let iconBg = '#3498db'; // Default Blue
        let target = x.t.toString();

        if (target === 'Big') {
            iconBg = '#fb9401';
        } else if (target === 'Small') {
            iconBg = '#3498db';
        } else if (target === 'Red' || target === '2' || target === '4' || target === '6' || target === '8') {
            iconBg = 'var(--red)';
        } else if (target === 'Green' || target === '1' || target === '3' || target === '7' || target === '9') {
            iconBg = 'var(--green)';
        } else if (target === 'Violet') {
            iconBg = 'var(--violet)';
        } else if (target === '0') {
            // 0 ke liye Red aur Violet mix
            iconBg = 'linear-gradient(135deg, var(--red) 50%, var(--violet) 50%)';
        } else if (target === '5') {
            // 5 ke liye Green aur Violet mix
            iconBg = 'linear-gradient(135deg, var(--green) 50%, var(--violet) 50%)';
        }

        // Icon Text Logic
        let iconText = "";
        if (target === 'Big') iconText = "Big";
        else if (target === 'Small') iconText = "Small";
        else if (!isNaN(target)) iconText = target; // Number khud dikhega

        let resDisplay = x.status === 'success' ? `+₹${x.res.toFixed(2)}` : `-₹${x.a.toFixed(2)}`;
        if (x.status === 'pending') resDisplay = `₹${x.a.toFixed(2)}`;

        return `
            <div class="my-bet-item">
                <div class="bet-icon" style="background:${iconBg};width:55px; height:55px; font-weight:bold; font-size:16px; color:white;">${iconText}</div>
                <div class="bet-info">
                    <div style="font-size:14px; font-weight:normal; color:white;">${x.p}</div>
                    <div style="font-size:11px; color:#8a9bb5;">2025-12-28 12:00:00</div>
                </div>
                <div class="bet-res-amt">
                    <div style="color:${statusColor}; border:1px solid ${statusColor}; padding:2px 8px; border-radius:15px; font-size:10px; display:inline-block; margin-bottom:5px; font-weight:normal;">${statusText}</div>
                    <div style="color:${statusColor}; font-size:15px; font-weight:normal;">${resDisplay}</div>
                </div>
            </div>`;
    }).join('');
}



    function switchTab(t) {
        document.getElementById('tab-game').classList.toggle('active', t==='game');
        document.getElementById('tab-my').classList.toggle('active', t==='my');
        document.getElementById('game-table-div').style.display = t==='game' ? 'block' : 'none';
        document.getElementById('my-table-div').style.display = t==='my' ? 'block' : 'none';
        if(t==='my') renderMyHistory();
    }

    function showPopup(win, amt, num, clr, p) {
    const card = document.querySelector('.png-card');
    const amtBox = document.querySelector('.pop-amt-box');
    const pop = document.getElementById('res-popup-box');

    // Win ya Loss ke hisab se image set karna
    if (!win) {
        card.classList.add('fail');
        amtBox.style.display = 'none'; // Loss par amount nahi dikhana
    } else {
        card.classList.remove('fail');
        amtBox.style.display = 'block';
        document.getElementById('pop-amt').innerText = amt.toFixed(2);
    }

    // Color background set karna
    const colorHex = clr === 'green' ? 'var(--green)' : (clr === 'red' ? 'var(--red)' : 'var(--violet)');
    
    const cLbl = document.getElementById('pop-color');
    cLbl.innerText = clr;
    cLbl.style.background = colorHex;

    const nLbl = document.getElementById('pop-num');
    nLbl.innerText = num;
    // Special case for number 0 and 5 (multi-color)
    if(num == 0 || num == 5) {
        nLbl.style.background = 'linear-gradient(to right, var(--red), var(--violet))';
    } else {
        nLbl.style.background = colorHex;
    }

    const sLbl = document.getElementById('pop-size');
    const size = num >= 5 ? 'Big' : 'Small';
    sLbl.innerText = size;
    sLbl.style.background = (size === 'Big') ? 'var(--gold)' : '#3498db';

    document.getElementById('pop-period').innerText = p;

    // Popup dikhana
    pop.style.display = 'flex';
    
    // 3 second baad khud hi band ho jaye
    setTimeout(() => { pop.style.display = 'none'; }, 3000);
}

// اپنے پرانے window.onload کو ڈیلیٹ کر کے یہ والا پیسٹ کریں
window.onload = () => {
    loadBalance(); 
    startTimer(); 
    renderMyHistory(); 
    
    // 2 سیکنڈ کا انتظار تاکہ ٹائمر پیریڈ نمبر جنریٹ کر لے
    setTimeout(fetchHistoryFromSheet, 2000); 
};

</script>
